name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Backend API URL"
        required: false
        default: "https://portfolio-os-api-5c7z.onrender.com"

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Prepare Vercel Deployment
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
      is_prod: ${{ steps.check.outputs.is_prod }}
      env_name: ${{ steps.check.outputs.env_name }}
    steps:
      - name: Determine target environment
        id: check
        env:
          V_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
          V_ORG: ${{ secrets['VERCEL_ORG_ID'] }}
          V_PROJECT: ${{ secrets['VERCEL_PROJECT_ID'] }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            echo "env_name=Vercel" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "env_name=Vercel Preview" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$V_TOKEN" ] && [ -n "$V_ORG" ] && [ -n "$V_PROJECT" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: ${{ needs.preflight.outputs.env_name }}
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.preflight.outputs.env_name }}
      url: ${{ steps.deploy.outputs.url || 'https://emman-os-portfolio.com' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies & Build Verification
        if: needs.preflight.outputs.has_secrets != 'true'
        working-directory: client
        env:
          VITE_API_URL: ${{ inputs.vite_api_url || 'https://portfolio-os-api-5c7z.onrender.com' }}
        run: |
          npm ci || npm install
          npm run build
          echo "Vercel GitHub App handles live deployment; Vite build verified."

      - name: Install Vercel CLI
        if: needs.preflight.outputs.has_secrets == 'true'
        run: npm install --global vercel@latest

      - name: Pull, Build & Deploy to Vercel
        id: deploy
        if: needs.preflight.outputs.has_secrets == 'true'
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
          VERCEL_ORG_ID: ${{ secrets['VERCEL_ORG_ID'] }}
          VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}
          VITE_API_URL: ${{ inputs.vite_api_url || 'https://portfolio-os-api-5c7z.onrender.com' }}
          IS_PROD: ${{ needs.preflight.outputs.is_prod }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
