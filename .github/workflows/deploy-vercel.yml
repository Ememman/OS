name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "client/**"
      - ".github/workflows/deploy-vercel.yml"
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Backend API URL"
        required: false
        default: "https://portfolio-os-api-5c7z.onrender.com"

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Prepare Vercel Deployment
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      is_prod: ${{ steps.check.outputs.is_prod }}
      env_name: ${{ steps.check.outputs.env_name }}
    steps:
      - name: Check credentials & target environment
        id: check
        env:
          V_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
          V_ORG: ${{ secrets['VERCEL_ORG_ID'] }}
          V_PROJECT: ${{ secrets['VERCEL_PROJECT_ID'] }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            echo "env_name=vercel-production" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "env_name=vercel-preview" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$V_TOKEN" ] && [ -n "$V_ORG" ] && [ -n "$V_PROJECT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Vercel Action deploy: set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub repository secrets (or connect the Vercel GitHub App)."
          fi

  deploy:
    name: Deploy (${{ needs.preflight.outputs.env_name }})
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.preflight.outputs.env_name }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull, Build & Deploy to Vercel
        id: deploy
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
          VERCEL_ORG_ID: ${{ secrets['VERCEL_ORG_ID'] }}
          VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}
          VITE_API_URL: ${{ inputs.vite_api_url || 'https://portfolio-os-api-5c7z.onrender.com' }}
          IS_PROD: ${{ needs.preflight.outputs.is_prod }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
