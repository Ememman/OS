name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches:
      - main
      - dev
      - fix/rework-workflow
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Backend API URL"
        required: false
        default: "https://portfolio-os-api-5c7z.onrender.com"

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Publish to gh-pages Branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build client with Vite
        env:
          VITE_API_URL: ${{ inputs.vite_api_url || 'https://portfolio-os-api-5c7z.onrender.com' }}
        run: npm run build

      - name: Add .nojekyll and 404.html fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: gh-pages
          commit_message: "deploy: publish Portfolio OS to gh-pages [skip ci]"
