name: Deploy Client to GitHub Pages (Actions Environment)

on:
  push:
    branches:
      - main
      - dev
      - fix/rework-workflow
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Backend API URL"
        required: false
        default: "https://portfolio-os-api-5c7z.onrender.com"

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Client SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build client with Vite
        env:
          VITE_API_URL: ${{ inputs.vite_api_url || vars.VITE_API_URL || secrets.VITE_API_URL || 'https://portfolio-os-api-5c7z.onrender.com' }}
        run: npm run build

      - name: Add .nojekyll and 404.html
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
