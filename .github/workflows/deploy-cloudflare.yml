name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Backend API URL"
        required: false
        default: "https://portfolio-os-api-5c7z.onrender.com"

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Prepare Cloudflare Deployment
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
      is_prod: ${{ steps.check.outputs.is_prod }}
      env_name: ${{ steps.check.outputs.env_name }}
    steps:
      - name: Determine target environment
        id: check
        env:
          CF_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] }}
          CF_ACCOUNT: ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            echo "env_name=Cloudflare" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "env_name=Cloudflare Preview" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: ${{ needs.preflight.outputs.env_name }}
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.preflight.outputs.env_name }}
      url: ${{ needs.preflight.outputs.is_prod == 'true' && 'https://emman-os-portfolio.com' || (steps.wrangler.outputs.deployment-url || 'https://os-portfolio.mendozajamesemmanuel.workers.dev') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: client
        run: npm ci || npm install

      - name: Build Client SPA
        working-directory: client
        env:
          VITE_API_URL: ${{ inputs.vite_api_url || 'https://portfolio-os-api-5c7z.onrender.com' }}
        run: npm run build

      - name: Deploy to Cloudflare Workers via Wrangler
        id: wrangler
        if: needs.preflight.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets['CLOUDFLARE_API_TOKEN'] }}
          accountId: ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] }}
          workingDirectory: client
          command: ${{ needs.preflight.outputs.is_prod == 'true' && 'deploy' || 'versions upload' }}

      - name: Verify Cloudflare Deployment
        if: needs.preflight.outputs.has_secrets != 'true'
        run: |
          echo "Cloudflare Workers Builds Git integration handles deployment; verifying live endpoint..."
          curl -fsSIL --max-time 15 https://emman-os-portfolio.com/ | head -n 5 || true
